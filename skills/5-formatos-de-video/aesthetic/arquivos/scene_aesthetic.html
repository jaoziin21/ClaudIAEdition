<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:BEB;src:url("node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff2")}
html,body{margin:0;background:#000;overflow:hidden;width:100vw;height:100vh}
canvas{position:absolute;inset:0}
</style></head><body><canvas id="c"></canvas>
<script src="aesthetic_data.js"></script>
<script>
// AESTHETIC — edição de quadrinhos em tela cheia (1080x1920): imagens paradas que "ganham vida".
// Cada plano (corte na batida) usa um movimento: zoom | card (quadrinho com borda de RAIO sobre estrelas) | pan | gira (giro 3D)
// | voa (quadrinho encolhe e voa no espaço) | tremor (soco + tremida + RGB) | camadas (personagem recortado na frente, fundo
// desfocado atrás, cada um num ritmo + raios de mangá). Entrada de cada plano: soco de escala + desfoque de movimento + clarão.
// Batidas fortes: inversão de cor / tinta vermelha ou verde (2–3 quadros). Texto palavra por palavra (Bebas, brilho, chave vermelha).
// Fim: glitch derretendo (fatias deslocadas). Tudo determinístico por tempo.
const A = AE, W = innerWidth, H = innerHeight;
const cv = document.getElementById('c'), g = cv.getContext('2d'); cv.width = W; cv.height = H;
const T = new OffscreenCanvas(W, H), tg = T.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eOut = t => 1 - Math.pow(1 - t, 3), eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const rnd = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
const IM = new Map();
const carrega = async src => { if (!src) return null; if (!IM.has(src)) { const im = new Image(); im.src = src; IM.set(src, im); try { await im.decode(); } catch {} } return IM.get(src); };

// ---- fundo de estrelas (3 camadas em velocidades diferentes) + névoa colorida ----
const R0 = rnd(99), STARS = Array.from({ length: 420 }, () => ({ x: R0(), y: R0(), z: R0(), f: R0() * 6.28 }));
function estrelas(t, vel = 1) {
  g.fillStyle = '#020208'; g.fillRect(0, 0, W, H);
  for (const [cx, cy, cor, r] of [[0.2, 0.25, '60,40,140', 0.6], [0.85, 0.7, '20,60,150', 0.55], [0.5, 0.95, '120,20,90', 0.45]]) {
    const gr = g.createRadialGradient(W * cx, H * cy, 0, W * cx, H * cy, W * r); gr.addColorStop(0, `rgba(${cor},.35)`); gr.addColorStop(1, `rgba(${cor},0)`); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  for (const s of STARS) { const d = 0.3 + s.z * 1.7, x = ((s.x * W - t * 12 * d * vel) % W + W) % W, y = s.y * H, a = 0.35 + 0.65 * Math.abs(Math.sin(t * 2 + s.f)) * s.z;
    g.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`; g.fillRect(x, y, d, d); }
}
// desenha imagem cobrindo (cover) ou contida (contain) num retângulo, com zoom z e deslocamento (ox, oy em fração)
function img(ctx, im, x, y, w, h, z = 1, ox = 0, oy = 0, cover = true) {
  if (!im || !im.width) return; const r = cover ? Math.max(w / im.width, h / im.height) : Math.min(w / im.width, h / im.height);
  const iw = im.width * r * z, ih = im.height * r * z; ctx.drawImage(im, x + (w - iw) / 2 + ox * w, y + (h - ih) / 2 + oy * h, iw, ih);
}
// borda de RAIO elétrico (azul/branco), redesenhada a cada 2 quadros
function raio(x, y, w, h, t, seed) {
  const r = rnd(seed + Math.floor(t * 15)), pts = [], seg = 28, per = 2 * (w + h);
  for (let i = 0; i <= seg * 4; i++) { const d = per * i / (seg * 4); let px, py;
    if (d < w) { px = x + d; py = y; } else if (d < w + h) { px = x + w; py = y + d - w; } else if (d < 2 * w + h) { px = x + w - (d - w - h); py = y + h; } else { px = x; py = y + h - (d - 2 * w - h); }
    pts.push([px + (r() - .5) * 18, py + (r() - .5) * 18]); }
  g.save(); g.lineJoin = 'miter';
  for (const [lw, cor, bl] of [[16, 'rgba(70,110,255,.55)', 30], [7, 'rgba(150,200,255,.9)', 12], [2.5, '#fff', 0]]) {
    g.shadowColor = 'rgba(90,140,255,1)'; g.shadowBlur = bl; g.strokeStyle = cor; g.lineWidth = lw;
    g.beginPath(); pts.forEach(([px, py], i) => i ? g.lineTo(px, py) : g.moveTo(px, py)); g.closePath(); g.stroke(); }
  g.restore();
}
// raios de mangá (speed lines) saindo do centro
function raiosManga(t, seed, a = 1, cx = W / 2, cy = H * 0.45) {
  const r = rnd(seed + Math.floor(t * 20)); g.save(); g.globalCompositeOperation = 'screen';
  for (let i = 0; i < 90; i++) { const an = r() * 6.283, w2 = 0.004 + r() * 0.012, R = Math.hypot(W, H);
    g.fillStyle = `rgba(255,248,225,${(0.08 + r() * 0.25) * a})`; g.beginPath(); g.moveTo(cx + Math.cos(an) * 160, cy + Math.sin(an) * 160);
    g.lineTo(cx + Math.cos(an - w2) * R, cy + Math.sin(an - w2) * R); g.lineTo(cx + Math.cos(an + w2) * R, cy + Math.sin(an + w2) * R); g.fill(); }
  g.restore();
}

async function plano(S, t) {
  const p = clamp((t - S.s) / (S.e - S.s)), dt = t - S.s, r = rnd(S.seed), im = await carrega(S.img);
  const soco = 1 + 0.1 * (1 - eOut(clamp(dt / 0.18))), dir = r() < .5 ? -1 : 1;
  // quadrinho grande e quase quadrado (imagem horizontal é recortada no centro) — ocupa o celular
  const cardW = W * 0.9, cardH = cardW * (im && im.width ? clamp(im.height / im.width, 0.95, 1.3) : 1), cx = (W - cardW) / 2, cy = H * 0.4 - cardH / 2;
  switch (S.mov) {
    case 'zoom': g.fillStyle = '#000'; g.fillRect(0, 0, W, H); img(g, im, 0, 0, W, H, (1 + 0.14 * eIO(p)) * soco, dir * 0.03 * p, 0); break;
    case 'pan': g.fillStyle = '#000'; g.fillRect(0, 0, W, H); img(g, im, 0, 0, W, H, 1.05 * soco, 0, 0); {
        // imagem larga: atravessa da esquerda p/ direita (desenha de novo com deslocamento real)
        g.fillRect(0, 0, W, H); const rr = H / im.height, iw = im.width * rr * 1.05 * soco, maxo = Math.max(0, iw - W);
        g.drawImage(im, -maxo * (dir > 0 ? eIO(p) : 1 - eIO(p)), (H - im.height * rr * 1.05 * soco) / 2, iw, im.height * rr * 1.05 * soco); } break;
    case 'card': case 'tremor': {
      estrelas(t); const z = soco * (1 + 0.05 * p), sx = S.mov === 'tremor' && dt < 0.35 ? (r() - .5) * 40 * (1 - dt / 0.35) : 0;
      g.save(); g.translate(W / 2 + sx, cy + cardH / 2); g.rotate(dir * (0.02 - 0.03 * p)); g.scale(z, z); g.translate(-W / 2, -(cy + cardH / 2));
      g.save(); g.beginPath(); g.rect(cx, cy, cardW, cardH); g.clip(); img(g, im, cx, cy, cardW, cardH, 1.06 + 0.06 * p); g.restore();
      raio(cx, cy, cardW, cardH, t, S.seed); g.restore(); break; }
    case 'gira': {
      estrelas(t); const a = (1 - eOut(clamp(dt / 0.5))) * dir * 1.3, sc = Math.max(0.05, Math.abs(Math.cos(a)));
      g.save(); g.translate(W / 2, cy + cardH / 2); g.scale(sc * (1 + 0.04 * p), 1 + 0.04 * p); g.translate(-W / 2, -(cy + cardH / 2));
      g.save(); g.beginPath(); g.rect(cx, cy, cardW, cardH); g.clip(); img(g, im, cx, cy, cardW, cardH, 1.08); g.restore();
      raio(cx, cy, cardW, cardH, t, S.seed); g.restore(); break; }
    case 'voa': {
      estrelas(t, 3); const q = eIO(p), z = 1.0 - 0.82 * q, ox = dir * W * 0.32 * q, oy = -H * 0.18 * q;
      g.save(); g.translate(W / 2 + ox, cy + cardH / 2 + oy); g.rotate(dir * 0.5 * q); g.scale(z, z); g.translate(-W / 2, -(cy + cardH / 2));
      g.save(); g.beginPath(); g.rect(cx, cy, cardW, cardH); g.clip(); img(g, im, cx, cy, cardW, cardH, 1.06); g.restore();
      raio(cx, cy, cardW, cardH, t, S.seed); g.restore(); break; }
    case 'camadas': {
      const rec = await carrega(S.rec); g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      g.save(); g.filter = 'blur(6px) brightness(0.7)'; img(g, im, 0, 0, W, H, 1.15 + 0.05 * p, -dir * 0.04 * p, 0); g.restore();
      raiosManga(t, S.seed, 0.8);
      // personagem no MESMO enquadramento do fundo, mas cresce e anda mais rápido → salta para frente (2.5D)
      g.save(); g.shadowColor = 'rgba(0,0,0,.75)'; g.shadowBlur = 45; img(g, rec, 0, 0, W, H, (1.15 + 0.05 * p) * (1 + 0.12 * eIO(p)) * soco, dir * 0.05 * p, 0.02 * p); g.restore(); break; }
  }
  // desfoque de movimento na entrada (cópia esticada e transparente) + clarão de 2 quadros
  if (dt < 0.12) { g.save(); g.globalAlpha = 0.35 * (1 - dt / 0.12); g.drawImage(cv, -W * 0.03, -H * 0.03, W * 1.06, H * 1.06); g.restore(); }
  if (dt < 2 / A.fps * 1.5) { g.fillStyle = `rgba(255,255,255,${S.forte ? 0.7 : 0.4})`; g.fillRect(0, 0, W, H); }
}

function texto(t) {
  const C = A.texto.find(c => t >= c.s && t < c.e); if (!C) return;
  const vis = C.ws.filter(w => t >= w.s - 0.03); if (!vis.length) return;
  const S = 168; g.save(); g.font = `${S}px BEB`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const linhas = vis.length <= 2 ? [vis] : [vis.slice(0, 2), vis.slice(2)];
  linhas.forEach((l, li) => {
    const y = H * 0.74 + (li - (linhas.length - 1) / 2) * S * 0.92;
    const txt = l.map(w => w.w).join(' '), tw = g.measureText(txt).width; let x = W / 2 - tw / 2;
    for (const w of l) { const ww = g.measureText(w.w + ' ').width, p = eOut(clamp((t - w.s + 0.03) / 0.12));
      g.save(); g.globalAlpha = p; g.translate(x + g.measureText(w.w).width / 2, y); g.scale(1 + 0.25 * (1 - p), 1 + 0.25 * (1 - p));
      g.shadowColor = w.k ? 'rgba(255,40,40,.9)' : 'rgba(255,255,255,.8)'; g.shadowBlur = 26; g.fillStyle = w.k ? '#FF2A2A' : '#FFFFFF'; g.fillText(w.w, 0, 0);
      g.shadowBlur = 0; g.fillText(w.w, 0, 0); g.restore(); x += ww; }
  });
  g.restore();
}

window.render = async t => {
  const S = A.shots.find(s => t >= s.s && t < s.e) || A.shots.at(-1);
  g.save(); await plano(S, t); g.restore();
  // batida forte: inversão de cor (2 quadros) ou tinta vermelha/verde (3 quadros), alternando
  const fb = A.beats.findIndex(b => t >= b && t < b + 3 / A.fps * 2);
  if (fb >= 0) { const k = fb % 3;
    if (k === 0 && t < A.beats[fb] + 2 / A.fps * 2) { g.save(); g.globalCompositeOperation = 'difference'; g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.restore(); }
    else if (k > 0) { g.save(); g.globalCompositeOperation = 'color'; g.globalAlpha = 0.55; g.fillStyle = k === 1 ? '#ff1430' : '#30ff60'; g.fillRect(0, 0, W, H); g.restore(); } }
  texto(t);
  // separação RGB curta em cada corte
  const dc = t - S.s; if (dc < 0.1) { tg.clearRect(0, 0, W, H); tg.drawImage(cv, 0, 0); const o = 14 * (1 - dc / 0.1);
    g.save(); g.globalCompositeOperation = 'screen'; g.globalAlpha = 0.5; g.drawImage(T, o, 0); g.drawImage(T, -o, 0); g.restore(); }
  // fim: glitch derretendo (fatias horizontais deslocadas)
  const fim = (t - (A.dur - 0.9)) / 0.9;
  if (fim > 0) { tg.clearRect(0, 0, W, H); tg.drawImage(cv, 0, 0); const r = rnd(Math.floor(t * A.fps));
    for (let y = 0; y < H; y += 24) { const o = (r() - .5) * 260 * fim * fim; g.drawImage(T, 0, y, W, 24, o, y + Math.sin(y * 0.02 + t * 9) * 30 * fim, W, 24); }
    g.fillStyle = `rgba(0,0,0,${clamp(fim * 1.2 - 0.2)})`; g.fillRect(0, 0, W, H); }
  // grão leve
  const r = rnd(Math.floor(t * A.fps) * 7 + 1); g.fillStyle = 'rgba(255,255,255,.035)';
  for (let i = 0; i < 900; i++) g.fillRect(r() * W, r() * H, 1.5, 1.5);
};
window.fontsOK = async () => { await document.fonts.load('150px BEB'); await document.fonts.ready;
  await Promise.all(A.shots.map(s => Promise.all([carrega(s.img), carrega(s.rec)])));
  return document.fonts.check('150px BEB') ? 'ok' : 'font missing'; };
</script></body></html>
