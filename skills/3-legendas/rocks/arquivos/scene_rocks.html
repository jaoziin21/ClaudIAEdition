<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:TN;src:url("node_modules/@fontsource/tinos/files/tinos-latin-400-normal.woff2");font-weight:400}
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
canvas{position:absolute;inset:0}
#stage{position:absolute;inset:0;perspective:900px}
/* "Rocks": versal serifada branca com relevo cromado escuro (extrusão p/ baixo-direita) + brilho branco, num plano inclinado */
#blk{position:absolute;left:0;top:0;font-family:TN;font-weight:400;text-transform:uppercase;color:#F6F6F4;line-height:.86;transform-origin:0 100%;
  display:flex;align-items:center}
.cap{font-size:2.05em;line-height:.8;margin-right:.04em}
.lns{display:flex;flex-direction:column}
.ln{white-space:nowrap;display:flex;align-items:flex-end}
.w{position:relative;display:inline-block;margin-right:.17em;
  text-shadow:1px 1px 0 #9a9a9a,2px 2px 0 #7d7d7d,3px 3px 0 #646464,4px 4px 0 #4f4f4f,5px 5px 0 #3d3d3d,6px 6px 0 #2e2e2e,7px 7px 0 #222,
   0 0 10px rgba(255,255,255,.55),0 0 26px rgba(255,255,255,.28),9px 10px 16px rgba(0,0,0,.7)}
.w i{position:absolute;inset:-20% -30%;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 60%)}
</style></head><body><canvas id="vhs"></canvas><div id="stage"><div id="blk"></div></div>
<script src="lado_data.js"></script>
<script>
// Cada frase vira um bloco de 2 linhas encaixadas, em versal: em cada linha a palavra mais forte (chave ou mais longa) fica maior;
// a 2ª linha recua p/ direita (escada, como "PORÉM EU / VOS DIGO"). Frase que começa com letra solta (A, E, O, Ó) vira CAPITULAR
// gigante ao lado das duas linhas ("A | VOSSOS / INIMIGOS"). Plano inclinado (sobe p/ direita, perspectiva), variando um pouco por frase.
// Entrada de cada palavra: aparece com um RISCO DE LUZ que corta a palavra e um pico de brilho. Saída: corte seco (0,08 s).
// VHS (canvas): linhas de varredura bem leves + faixa de "tracking" ruidosa que passa em cada corte.
const D = LADO, W = innerWidth, H = innerHeight, FPS = 30;
const BAND = (H >= 1900 && D.band) ? D.band : { y: 0, h: H };
const blk = document.getElementById('blk'), S = D.size || 64;
blk.style.fontSize = S + 'px';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eOut = t => 1 - Math.pow(1 - t, 3);
const rnd = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
const DANGLE = new Set('a o as os um uma e de do da dos das em no na nos nas por para pra com que se me te lhe à ao aos não mas pois é eu vos o'.split(' '));
const nucleo = w => w.replace(/[?!.,]+$/, '').toLowerCase();

// ---- VHS ----
const g = document.getElementById('vhs').getContext('2d'); g.canvas.width = W; g.canvas.height = H;
function vhs(t) {
  g.clearRect(0, 0, W, H); g.save(); g.beginPath(); g.rect(0, BAND.y, W, BAND.h); g.clip();
  g.fillStyle = 'rgba(0,0,0,.10)'; for (let y = BAND.y; y < BAND.y + BAND.h; y += 4) g.fillRect(0, y, W, 1.4);
  for (const c of D.cuts || []) { const k = (t - c + 0.05) / 0.35; if (k < 0 || k > 1) continue;
    const y = BAND.y + BAND.h * (1.1 - k * 1.3), h = 26 + 30 * Math.sin(Math.PI * k), r = rnd(Math.floor(t * FPS) * 13 + 7);
    for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${(0.15 + r() * 0.45).toFixed(2)})`; g.fillRect(r() * W, y + r() * h, 20 + r() * 140, 1 + r() * 2); }
    g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(0, y, W, h); }
  g.restore();
}

// ---- bloco ----
let cur = null, items = [];
function monta(B, bi) {
  const ws = B.lines.flat(); items = []; blk.innerHTML = '';
  let rest = ws, capW = null;
  if (ws.length >= 2 && /^[aeoóé]$/i.test(nucleo(ws[0].w))) { capW = ws[0]; rest = ws.slice(1); }
  // 2 linhas equilibradas por número de letras
  const tot = rest.reduce((a, w) => a + w.w.length, 0); let acc = 0, cut = rest.length;
  if (rest.length >= 2) { cut = 1; for (let i = 0; i < rest.length - 1; i++) { acc += rest[i].w.length; if (acc >= tot / 2) { cut = i + 1; break; } cut = i + 1; } }
  const L = [rest.slice(0, cut), rest.slice(cut)].filter(l => l.length);
  const mk = (w, cls, sz) => { const e = document.createElement('span'); e.className = 'w ' + (cls || ''); e.textContent = w.w; if (sz) e.style.fontSize = sz + 'em';
    const i = document.createElement('i'); e.appendChild(i); items.push({ e, i, s: w.s }); return e; };
  if (capW) blk.appendChild(mk(capW, 'cap'));
  const lns = document.createElement('div'); lns.className = 'lns'; blk.appendChild(lns);
  L.forEach((l, li) => {
    const d = document.createElement('div'); d.className = 'ln';
    // a palavra mais forte da linha (chave > mais longa que não é conector) fica 1,3x
    const cand = l.map((w, j) => [j, w]).filter(([, w]) => !DANGLE.has(nucleo(w.w)));
    const big = l.findIndex(w => w.k) >= 0 ? l.findIndex(w => w.k) : (cand.length ? cand.reduce((a, b) => (b[1].w.length >= a[1].w.length ? b : a))[0] : -1);
    l.forEach((w, j) => d.appendChild(mk(w, '', j === big && l.length > 1 ? 1.3 : (l.length === 1 && (w.k || L.length === 1) ? 1.3 : 1))));
    if (li === 1 && !capW) d.style.marginLeft = (0.9 + (bi % 3) * 0.35) + 'em';   // escada
    lns.appendChild(d);
  });
  // posição: canto da cena (padrão embaixo à esquerda); inclinação varia levemente por frase
  blk.style.transform = ''; const bw = blk.offsetWidth, bh = blk.offsetHeight, k = Math.min(1, (W * 0.84) / bw);
  const r = rnd(bi * 97 + 3), rz = -(3 + r() * 4), ry = 10 + r() * 10;
  blk.style.left = clamp(B.x * W - bw * k / 2, 36, W - bw * k - 60) + 'px';
  blk.style.top = (BAND.y + clamp(B.y * BAND.h - bh / 2, 30 - bh * (1 - k), BAND.h - bh - 40)) + 'px';
  blk.dataset.tf = `rotateY(${ry.toFixed(1)}deg) rotateZ(${rz.toFixed(1)}deg) scale(${k.toFixed(3)})`;
}

window.render = t => {
  vhs(t);
  const bi = D.blocks.findIndex(b => t >= b.start && t < b.end), B = bi >= 0 ? D.blocks[bi] : null;
  if (B !== cur) { cur = B; if (B) monta(B, bi); else { blk.innerHTML = ''; items = []; } }
  if (!B) return;
  const out = clamp((t - (B.end - 0.08)) / 0.08);
  blk.style.transform = blk.dataset.tf; blk.style.opacity = (1 - out).toFixed(3);
  for (const it of items) {
    const dt = t - it.s + 0.03, s = it.e.style;
    if (dt < 0) { s.opacity = 0; continue; }
    const p = eOut(clamp(dt / 0.16)), flash = Math.exp(-Math.pow((dt - 0.08) / 0.12, 2));
    s.opacity = p.toFixed(3);
    s.transform = `scale(${(1 + (1 - p) * 0.18).toFixed(3)})`;
    s.filter = flash > 0.02 ? `brightness(${(1 + 0.6 * flash).toFixed(2)}) drop-shadow(0 0 ${(8 + 20 * flash).toFixed(0)}px rgba(255,255,255,${(0.6 * flash).toFixed(2)}))` : '';
    // risco de luz atravessando a palavra (0,22 s)
    const q = clamp(dt / 0.22); it.i.style.opacity = q > 0 && q < 1 ? (Math.sin(Math.PI * q)).toFixed(2) : 0;
    it.i.style.transform = `translateX(${((q - 0.5) * 180).toFixed(0)}%)`;
  }
};
window.fontsOK = async () => { await document.fonts.load(`400 ${S}px TN`); await document.fonts.ready; return document.fonts.check(`400 ${S}px TN`) ? 'ok' : 'font missing'; };
</script></body></html>
