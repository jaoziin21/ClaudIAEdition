<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:BS;src:url("node_modules/@fontsource/arimo/files/arimo-latin-400-normal.woff2");font-weight:400}
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
canvas{position:absolute;inset:0}
/* "Black Sample": legenda de TV — branca, sem serifa neutra (Arimo = Arial), minúscula, numa caixa PRETA justa que cresce com o texto */
#ln{position:absolute;left:0;top:0;white-space:pre;font-family:BS;font-weight:400;line-height:1.16;color:#fff;letter-spacing:.005em}
#box{position:absolute;left:0;top:0;background:#000}
</style></head><body><div id="box"></div><div id="ln"></div><canvas id="gl"></canvas>
<script src="lado_data.js"></script>
<script>
// O texto se escreve EM PEDAÇOS no ritmo da fala: palavra curta entra inteira; palavra longa entra em sílabas ("ob" → "obser" →
// "observando"). A frase fica centralizada e a caixa preta justa cresce para os dois lados. Em CADA pedaço novo, 1 quadro de
// falha: a linha vira um risco achatado e borrado na horizontal, com varredura (como sinal de TV). No fim da frase a legenda
// PISCA (some 2 quadros, volta 2, some 2, volta 2) e sai. Opções no lado.json: "glitch": false, "piscar": false.
const D = LADO, W = innerWidth, H = innerHeight, FPS = 30;
const BAND = (H >= 1900 && D.band) ? D.band : { y: 0, h: H };
const ln = document.getElementById('ln'), box = document.getElementById('box'), cv = document.getElementById('gl');
cv.width = W; cv.height = H; const g = cv.getContext('2d');
const S = D.size || 38;
ln.style.fontSize = S + 'px';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const rnd = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };

// ---- sílabas (português, regra simples, igual à Street) ----
const V = 'aeiouáéíóúâêôãõàü', isV = c => V.includes(c.toLowerCase());
const JUNTO = new Set('br cr dr fr gr pr tr vr bl cl fl gl pl ch lh nh qu gu'.split(' '));
function silabas(w) {
  const out = []; let cur = '';
  for (let i = 0; i < w.length; i++) {
    cur += w[i];
    const a = w[i + 1], b = w[i + 2];
    if (!a) break;
    if (isV(w[i]) && !isV(a) && b && isV(b) && !(a.toLowerCase() === 'q' || a.toLowerCase() === 'g')) { out.push(cur); cur = ''; continue; }
    if (isV(w[i]) && !isV(a) && b && !isV(b) && w[i + 3] && isV(w[i + 3])) {
      if (JUNTO.has((a + b).toLowerCase())) { out.push(cur); cur = ''; } else { cur += a; i++; out.push(cur); cur = ''; } continue; }
  }
  if (cur) out.push(cur);
  return out.join('') === w ? out : [w];
}
const minus = s => s.toLocaleLowerCase('pt-BR');

// ---- passos de cada frase: [{t, txt}] — o texto visível muda só nesses instantes ----
const PASSOS = new Map();
for (const B of D.blocks) {
  const ws = B.lines.flat(), passos = [];
  let feito = '';
  ws.forEach((w, i) => {
    const pal = minus(w.w), sl = silabas(pal.replace(/[?!.,:;]+$/, ''));
    const pre = feito ? feito + ' ' : '';
    let cortes = [pal];
    if (pal.length >= 5 && sl.length >= 2) {   // 1ª sílaba, metade, inteira (no máx. 3 passos)
      const n = sl.length, m = Math.max(2, Math.round(n * 0.6));
      cortes = [...new Set([sl.slice(0, 1).join(''), m < n ? sl.slice(0, m).join('') : null, pal].filter(Boolean))];
    }
    const dur = Math.max(0.05, (w.e - w.s));
    cortes.forEach((c, j) => passos.push({ t: w.s + dur * j / cortes.length * 0.9, txt: pre + c }));
    feito = pre + pal;
  });
  // passos a menos de 3 quadros um do outro viram um só (fala rápida: "deus ainda" entra junto)
  const lim = [];
  for (const p of passos) { if (lim.length && p.t - lim.at(-1).t < 3 / FPS) lim[lim.length - 1].txt = p.txt; else lim.push({ ...p }); }
  if (lim.length) lim[0].t = Math.max(B.start, lim[0].t);
  PASSOS.set(B, lim);
}

// ---- medida e desenho ----
const mede = document.createElement('canvas').getContext('2d');
const fonte = () => `400 ${S}px BS`;
function largura(txt) { mede.font = fonte(); return mede.measureText(txt).width; }
let cache = null;
function risco(txt, cx, cy, k, seed) {   // 1 quadro de falha: linha achatada + borrão horizontal + varredura
  const r = rnd(seed), tw = largura(txt) * k, pad = S * 0.24 * k, bw = tw * 1.04 + pad * 2.2, bh = S * 1.08 * k;
  g.fillStyle = 'rgba(0,0,0,.86)'; g.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);
  if (!cache || cache.txt !== txt) { const c = document.createElement('canvas'); c.width = Math.ceil(largura(txt)) + 8; c.height = Math.ceil(S * 1.3);
    const x = c.getContext('2d'); x.font = fonte(); x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.fillText(txt, 4, c.height / 2); cache = { txt, c }; }
  const ach = S * 0.66 * k, sx = cx - tw * 1.03 / 2, y0 = cy - ach / 2 + S * 0.06 * k;
  g.save(); g.globalCompositeOperation = 'lighter'; g.filter = `blur(${(1.4 * k).toFixed(2)}px)`;
  for (let i = 0; i < 10; i++) { g.globalAlpha = 0.15; g.drawImage(cache.c, sx + (i - 4.5) * S * 0.2 * k, y0 + (r() - .5) * 2 * k, tw * 1.03, ach); }
  g.restore(); g.globalAlpha = 1;
  for (let y = y0; y < y0 + ach; y += Math.max(2, 2 * k)) { g.fillStyle = 'rgba(0,0,0,.24)'; g.fillRect(sx - S * k, y, tw * 1.03 + 2 * S * k, Math.max(1, k)); }   // varredura
  for (let i = 0; i < 3; i++) { g.fillStyle = `rgba(230,230,230,${0.3 + r() * 0.3})`; g.fillRect(sx + r() * tw * 0.08, y0 + r() * ach, tw * (0.85 + r() * 0.15), Math.max(1, k)); }
  for (let i = 0; i < 7; i++) { g.fillStyle = `rgba(210,210,210,${0.18 + r() * 0.3})`; g.fillRect(sx + r() * tw, y0 + ach * (.2 + r() * .6), S * (0.3 + r() * 1.4) * k, Math.max(1, ach * 0.12)); }
  g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(sx + tw * (0.82 + r() * 0.14), cy - ach * 0.55, Math.max(1.5, 2.2 * k), ach * 1.1);   // tracinho de cursor
}

let atual = null;
window.render = t => {
  g.clearRect(0, 0, W, H);
  const B = D.blocks.find(b => t >= b.start && t < b.end) || null;
  const f = Math.round(t * FPS);
  if (!B) { box.style.opacity = 0; ln.style.opacity = 0; return; }
  const P = PASSOS.get(B) || [];
  let i = -1; for (let j = 0; j < P.length; j++) if (Math.round(P[j].t * FPS) <= f) i = j;
  // pisca no fim da frase: some 2, volta 2, some 2, volta 2 (só se a frase durar o bastante)
  const fe = Math.round(B.end * FPS), nb = fe - f;
  let some = false;
  if (D.piscar !== false && B.end - B.start > 1.2 && nb <= 9 && nb > 0) { const q = 9 - nb; some = q < 2 || (q >= 4 && q < 6) || q >= 8; }
  if (i < 0 || some) { box.style.opacity = 0; ln.style.opacity = 0; return; }
  const txt = P[i].txt;
  const tw = largura(txt), k = Math.min(1, (W * 0.9) / (tw + S));
  const cx = clamp(B.x * W, 30 + tw * k / 2, W - 30 - tw * k / 2), cy = BAND.y + clamp(B.y * BAND.h, S, BAND.h - S);
  // 1 quadro de falha em cada pedaço novo
  if (D.glitch !== false && Math.round(P[i].t * FPS) === f) { box.style.opacity = 0; ln.style.opacity = 0; risco(txt, cx, cy, k, f * 7 + i); return; }
  if (atual !== txt) { ln.textContent = txt; atual = txt; }
  const lw = ln.offsetWidth, lh = ln.offsetHeight;
  ln.style.transform = `scale(${k})`; ln.style.transformOrigin = '50% 50%';
  ln.style.left = (cx - lw / 2) + 'px'; ln.style.top = (cy - lh / 2) + 'px'; ln.style.opacity = 1;
  const pad = S * 0.24;
  Object.assign(box.style, { left: (cx - (lw / 2 + pad) * k) + 'px', top: (cy - (lh / 2 - S * 0.02) * k) + 'px',
    width: ((lw + pad * 2) * k) + 'px', height: ((lh - S * 0.06) * k) + 'px', opacity: 1 });
};
window.fontsOK = async () => { await document.fonts.load(`400 ${S}px BS`); await document.fonts.ready;
  return document.fonts.check(`400 ${S}px BS`) ? 'ok' : 'font missing'; };
</script></body></html>
