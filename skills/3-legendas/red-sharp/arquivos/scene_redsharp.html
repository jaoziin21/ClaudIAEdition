<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:TN;src:url("node_modules/@fontsource/tinos/files/tinos-latin-400-normal.woff2");font-weight:400}
@font-face{font-family:MONB;src:url("node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2");font-weight:900}
@font-face{font-family:BODI;src:url("node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-500-italic.woff2");font-weight:500;font-style:italic}
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
canvas{position:absolute;inset:0}
/* legenda normal: serifa fina branca minúscula numa tarja preta (a tarja cresce com as palavras) */
#ln{position:absolute;left:0;top:0;white-space:nowrap;font-family:TN;color:#F4F1EA;line-height:1.3;letter-spacing:.01em}
#ln .w{display:inline-block;margin:0 .13em}
#box{position:absolute;left:0;top:0;background:rgba(0,0,0,.86)}
/* frase de IMPACTO: palavras vermelhas empilhadas, sem serifa pesado; a última em serifa itálica */
#imp{position:absolute;left:0;top:0;text-align:center;line-height:.86;color:#EC1A1E;
  filter:drop-shadow(0 0 16px rgba(255,20,20,.35)) drop-shadow(0 4px 8px rgba(0,0,0,.75))}
#imp .lnI{white-space:nowrap}
#imp .w{display:inline-block;font-family:MONB;font-weight:900;letter-spacing:-.035em}
#imp .w.ult{font-family:BODI;font-style:italic;font-weight:500;letter-spacing:-.02em;transform-origin:50% 60%}
</style></head><body><canvas id="fx"></canvas><div id="box"></div><div id="ln"></div><div id="imp"></div>
<script src="lado_data.js"></script>
<script>
// Frase com palavra-chave (escolher poucas, as mais fortes) = IMPACTO: palavras empilhadas, uma por linha, entram quando faladas
// com um "soco" (escala 1,18→1) + tremida de 2 quadros + pulso de vinheta vermelha na imagem; saem uma a uma de cima p/ baixo.
// Demais frases = legenda pequena Tinos branca numa tarja preta, palavra por palavra no lugar final.
const D = LADO, W = innerWidth, H = innerHeight, FPS = 30;
const BAND = (H >= 1900 && D.band) ? D.band : { y: 0, h: H };
const ln = document.getElementById('ln'), box = document.getElementById('box'), imp = document.getElementById('imp');
const S = D.size || 36, SI = Math.round(BAND.h * 0.15);
ln.style.fontSize = S + 'px'; imp.style.fontSize = SI + 'px';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eOut = t => 1 - Math.pow(1 - t, 3);
const fx = document.getElementById('fx').getContext('2d'); fx.canvas.width = W; fx.canvas.height = H;

let cur = null, spans = [], flat = [], modo = null;
function monta(B) {
  flat = B.lines.flat(); modo = flat.some(w => w.k) ? 'imp' : 'leg';
  ln.innerHTML = imp.innerHTML = ''; box.style.opacity = 0;
  if (modo === 'imp') {
    // no máx. 4 linhas: junta o par vizinho mais curto (a última palavra fica sempre sozinha, em itálico)
    const L = flat.map((w, i) => [i]);
    while (L.length > 4) { let bi = 0, bl = 1e9; for (let i = 0; i < L.length - 2; i++) { const l = [...L[i], ...L[i + 1]].reduce((a, j) => a + flat[j].w.length + 1, 0); if (l < bl) { bl = l; bi = i; } } L.splice(bi, 2, [...L[bi], ...L[bi + 1]]); }
    imp.innerHTML = L.map((l, li) => `<div class="lnI">` + l.map(j => `<span class="w${j === flat.length - 1 && flat.length > 1 ? ' ult' : ''}">${flat[j].w}</span>`).join(' ') + `</div>`).join('');
    spans = [...imp.querySelectorAll('.w')];
    spans.forEach((e, i) => { if (e.classList.contains('ult')) { e.style.fontSize = '1.22em'; e.style.transform = 'scaleY(1.12)'; } });
    imp.style.transform = ''; const bw = imp.offsetWidth, bh = imp.offsetHeight, k = Math.min(1, (BAND.h * 0.86) / bh, (W * 0.8) / bw);
    imp.style.left = clamp(B.x * W - bw / 2, 40 - bw * (1 - k) / 2, W - bw - 40 + bw * (1 - k) / 2) + 'px';
    imp.style.top = (BAND.y + clamp(B.y * BAND.h - bh / 2, 20 - bh * (1 - k) / 2, BAND.h - bh - 20 + bh * (1 - k) / 2)) + 'px';
    imp.dataset.k = k;
  } else {
    ln.innerHTML = flat.map(w => `<span class="w">${w.w}</span>`).join(''); spans = [...ln.children];
    ln.style.transform = ''; const bw = ln.offsetWidth, bh = ln.offsetHeight, k = Math.min(1, (W * 0.86) / bw);
    ln.style.left = clamp(B.x * W - bw / 2, 30 - bw * (1 - k) / 2, W - bw - 30 + bw * (1 - k) / 2) + 'px';
    ln.style.top = (BAND.y + clamp(B.y * BAND.h - bh / 2, 20, BAND.h - bh - 20)) + 'px'; ln.style.transform = `scale(${k})`; ln.dataset.k = k;
  }
}

window.render = t => {
  fx.clearRect(0, 0, W, H);
  const B = D.blocks.find(b => t >= b.start && t < b.end) || null;
  if (B !== cur) { cur = B; if (B) monta(B); else { ln.innerHTML = imp.innerHTML = ''; box.style.opacity = 0; spans = []; } }
  if (!B) return;
  if (modo === 'imp') {
    const k = +imp.dataset.k, n = spans.length; let shake = 0, pulse = 0;
    spans.forEach((e, i) => { const w = flat[i], dt = t - w.s + 0.03;
      const sai = clamp((t - (Math.max(B.end - 0.55, flat[n - 1].s + 0.45) + i * 0.13)) / 0.06);   // some uma a uma, de cima p/ baixo
      if (dt < 0 || sai >= 1) { e.style.visibility = 'hidden'; return; }
      e.style.visibility = 'visible';
      const p = eOut(clamp(dt / 0.12)); e.style.opacity = clamp(dt / 0.05).toFixed(3);
      const base = e.classList.contains('ult') ? ' scaleY(1.12)' : '';
      e.style.transform = `scale(${(1 + (1 - p) * 0.18).toFixed(3)})` + base;
      const f = Math.round(dt * FPS); if (f >= 0 && f < 2) shake = Math.max(shake, 1);
      pulse = Math.max(pulse, Math.exp(-Math.pow((dt - 0.1) / 0.22, 2)));
    });
    const sx = shake ? (Math.round(t * FPS) % 2 ? 6 : -5) : 0, sy = shake ? (Math.round(t * FPS) % 2 ? -4 : 3) : 0;
    imp.style.transform = `translate(${sx}px,${sy}px) scale(${k})`;
    if (pulse > 0.02) {   // vinheta vermelha que pulsa na imagem a cada palavra do impacto
      const gr = fx.createRadialGradient(W / 2, BAND.y + BAND.h / 2, BAND.h * 0.25, W / 2, BAND.y + BAND.h / 2, W * 0.75);
      gr.addColorStop(0, 'rgba(160,0,0,0)'); gr.addColorStop(1, `rgba(170,0,0,${(0.45 * pulse).toFixed(3)})`);
      fx.save(); fx.beginPath(); fx.rect(0, BAND.y, W, BAND.h); fx.clip(); fx.fillStyle = gr; fx.fillRect(0, BAND.y, W, BAND.h); fx.restore();
    }
    return;
  }
  // legenda pequena com tarja que cresce
  const k = +ln.dataset.k, x0 = ln.offsetLeft + ln.offsetWidth / 2 * (1 - k), y0 = ln.offsetTop + ln.offsetHeight / 2 * (1 - k);
  const out = clamp((t - (B.end - 0.1)) / 0.1); let left = null, right = 0;
  spans.forEach((e, i) => { const w = flat[i], p = eOut(clamp((t - w.s + 0.03) / 0.12)); e.style.opacity = (p * (1 - out)).toFixed(3);
    if (p > 0) { if (left === null) left = e.offsetLeft; right = Math.max(right, e.offsetLeft + e.offsetWidth * (i === spans.length - 1 || p >= 1 ? 1 : p)); } });
  if (left === null) { box.style.opacity = 0; return; }
  const pad = S * 0.32;
  Object.assign(box.style, { left: (x0 + (left - pad) * k) + 'px', top: (y0 + S * 0.02 * k) + 'px', width: ((right - left + pad * 2) * k) + 'px', height: ((ln.offsetHeight - S * 0.04) * k) + 'px', opacity: (1 - out).toFixed(3) });
};
window.fontsOK = async () => {
  const req = [`400 ${S}px TN`, `900 ${SI}px MONB`, `italic 500 ${SI}px BODI`];
  await Promise.all(req.map(f => document.fonts.load(f, 'áé'))); await document.fonts.ready;
  return req.every(f => document.fonts.check(f, 'áé')) ? 'ok' : 'font missing';
};
</script></body></html>
