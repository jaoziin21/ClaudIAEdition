<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:AR;src:url("node_modules/@fontsource/archivo/files/archivo-latin-600-normal.woff2");font-weight:600}
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
#stage{position:absolute;inset:0;perspective:1000px}
/* "Samplerocks": layout do Rocks (plano inclinado, linhas em escada, embaixo à esquerda) com a cor do Sample Yellow —
   versal sem serifa (Archivo 600) branca, palavras fortes AMARELAS; cada palavra entra ESTICADA na horizontal e encaixa. */
#blk{position:absolute;left:0;top:0;font-family:AR;font-weight:600;text-transform:uppercase;color:#FAFAF6;line-height:.98;transform-origin:0 100%;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.65)) drop-shadow(0 4px 16px rgba(0,0,0,.45))}
.ln{white-space:nowrap}
.w{display:inline-block;margin-right:.22em;transform-origin:0 60%;letter-spacing:-.005em}
.w.k{color:#F2CF1B}
</style></head><body><div id="stage"><div id="blk"></div></div>
<script src="lado_data.js"></script>
<script>
// Linhas curtas (≤ 13 letras) equilibradas, 1–3 linhas, com recuo em escada que varia por frase.
// Amarelo: palavras-chave; frase sem palavra-chave → a última linha fica amarela (sempre tem um toque de amarelo).
// Entrada (0,2 s): a palavra chega da direita esticada 2,6x com rastro (desfoque horizontal) e encaixa. Saída: corte seco.
const D = LADO, W = innerWidth, H = innerHeight, FPS = 30;
const BAND = (H >= 1900 && D.band) ? D.band : { y: 0, h: H };
const blk = document.getElementById('blk'), S = D.size || 54;
blk.style.fontSize = S + 'px';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eOut = t => 1 - Math.pow(1 - t, 4);
const rnd = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
const ESCADAS = [[0.9, 0, 0.45], [0, 0.7, 0.2], [0.5, 0, 0.9], [0, 0.35, 0]];

let cur = null, items = [];
function monta(B, bi) {
  const ws = B.lines.flat(); items = []; blk.innerHTML = '';
  const n = Math.min(3, Math.max(1, Math.ceil(ws.reduce((a, w) => a + w.w.length + 1, 0) / 14)));
  const tot = ws.reduce((a, w) => a + w.w.length + 1, 0), L = []; let cur = [], acc = 0;
  ws.forEach((w, i) => { cur.push(w); acc += w.w.length + 1; if (L.length < n - 1 && acc >= tot * (L.length + 1) / n && i < ws.length - 1) { L.push(cur); cur = []; } });
  if (cur.length) L.push(cur);
  const temK = ws.some(w => w.k), esc = ESCADAS[bi % ESCADAS.length];
  L.forEach((l, li) => {
    const d = document.createElement('div'); d.className = 'ln'; d.style.marginLeft = esc[li] + 'em';
    l.forEach(w => { const e = document.createElement('span'); e.className = 'w' + (w.k || (!temK && li === L.length - 1 && L.length > 1) || (!temK && ws.length <= 2) ? ' k' : ''); e.textContent = w.w; d.appendChild(e); items.push({ e, s: w.s }); });
    blk.appendChild(d);
  });
  blk.style.transform = ''; const bw = blk.offsetWidth, bh = blk.offsetHeight, k = Math.min(1, (W * 0.8) / bw);
  const r = rnd(bi * 131 + 7), rz = -(2.5 + r() * 3), ry = 6 + r() * 8;
  blk.style.left = clamp(B.x * W - bw * k / 2, 40, W - bw * k - 60) + 'px';
  blk.style.top = (BAND.y + clamp(B.y * BAND.h - bh / 2, 30, BAND.h - bh - 40)) + 'px';
  blk.dataset.tf = `rotateY(${ry.toFixed(1)}deg) rotateZ(${rz.toFixed(1)}deg) scale(${k.toFixed(3)})`;
}

window.render = t => {
  const bi = D.blocks.findIndex(b => t >= b.start && t < b.end), B = bi >= 0 ? D.blocks[bi] : null;
  if (B !== cur) { cur = B; if (B) monta(B, bi); else { blk.innerHTML = ''; items = []; } }
  if (!B) return;
  blk.style.transform = blk.dataset.tf;
  for (const it of items) {
    const dt = t - it.s + 0.03, s = it.e.style;
    if (dt < 0) { s.opacity = 0; continue; }
    const p = eOut(clamp(dt / 0.2));
    s.opacity = clamp(dt / 0.06).toFixed(3);
    s.transform = p < 1 ? `translateX(${((1 - p) * 0.9).toFixed(3)}em) scaleX(${(1 + (1 - p) * 1.6).toFixed(3)})` : '';
    s.filter = p < 0.98 ? `blur(${((1 - p) * 5).toFixed(1)}px)` : '';
  }
};
window.fontsOK = async () => { await document.fonts.load(`600 ${S}px AR`); await document.fonts.ready; return document.fonts.check(`600 ${S}px AR`) ? 'ok' : 'font missing'; };
</script></body></html>
