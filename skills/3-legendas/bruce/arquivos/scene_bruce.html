<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:BR;src:url("node_modules/@fontsource/tinos/files/tinos-latin-400-normal.woff2");font-weight:400}
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
/* "Bruce": 1–2 palavras por vez, VERSAL serifada clássica (Tinos = Times), pequena, espaçada, branca com sombra discreta,
   ao lado de quem fala; entra em ~3 quadros (cinza e desfocada → branca e nítida), desliza devagar, sai seca */
#ln{position:absolute;left:0;top:0;white-space:pre;font-family:BR;font-weight:400;text-transform:uppercase;letter-spacing:.12em;
  line-height:1.1;color:#f1f1ee;text-shadow:0 .05em .1em rgba(0,0,0,.85),0 0 .5em rgba(0,0,0,.35)}
#ln span{display:inline-block}
</style></head><body><div id="ln"></div>
<script src="lado_data.js"></script>
<script>
// Cada bloco (1–2 palavras, maxch pequeno) fica no ponto da cena (x,y = centro do bloco já completo, ao lado do rosto).
// A 1ª palavra entra; a 2ª entra à DIREITA dela quando é falada (o bloco não pula: já está posicionado pela largura final).
// Entrada de cada palavra: 3 quadros de cinza+desfoque para branco nítido. O bloco desliza devagar (lado alterna a cada bloco).
// Saída: seca, no fim do bloco. Palavra-chave: um pouco mais clara com brilho leve.
const D = LADO, W = innerWidth, H = innerHeight, FPS = 30;
const BAND = (H >= 1900 && D.band) ? D.band : { y: 0, h: H };
const ln = document.getElementById('ln');
const S = D.size || 28;
ln.style.fontSize = S + 'px';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const BL = D.blocks.slice().sort((a, b) => a.start - b.start);
BL.forEach((B, i) => B.idx = i);

let cur = null, spans = [], ws = [];
window.render = t => {
  const B = D.blocks.find(b => t >= b.start && t < b.end) || null;
  if (B !== cur) {
    cur = B;
    if (B) { ws = B.lines.flat(); ln.innerHTML = ws.map((w, i) => `<span>${esc(w.w)}</span>`).join(' '); spans = [...ln.querySelectorAll('span')]; }
  }
  if (!B) { ln.style.opacity = 0; return; }
  const lw = ln.offsetWidth, lh = ln.offsetHeight, k = Math.min(1, (W * 0.8) / lw);
  // deriva lenta: ~2% da largura por segundo, lado alterna a cada bloco, com leve descida
  const dir = B.idx % 2 ? 1 : -1, dt = t - B.start, dx = dir * W * 0.02 * dt, dy = H * 0.004 * dt;
  const cx = clamp(B.x * W, 24 + lw * k / 2, W - 24 - lw * k / 2) + dx, cy = BAND.y + clamp(B.y * BAND.h, lh, BAND.h - lh) + dy;
  ln.style.transformOrigin = '50% 50%'; ln.style.transform = `scale(${k})`;
  ln.style.left = (cx - lw / 2) + 'px'; ln.style.top = (cy - lh / 2) + 'px'; ln.style.opacity = 1;
  const f = Math.round(t * FPS);
  spans.forEach((e, i) => { const w = ws[i], q = clamp((f - Math.round(w.s * FPS) + 1) / 3);   // 3 quadros para entrar
    e.style.visibility = q > 0 ? 'visible' : 'hidden';
    const cor = Math.round(120 + 121 * q), luz = w.k ? 1 : 0;
    e.style.color = luz ? `rgb(${cor + 14},${cor + 14},${cor + 10})` : `rgb(${cor},${cor},${cor - 3})`;
    e.style.filter = q < 1 ? `blur(${((1 - q) * 2.2).toFixed(2)}px)` : (luz ? 'drop-shadow(0 0 6px rgba(255,255,255,.35))' : '');
    e.style.opacity = (0.35 + 0.65 * q).toFixed(2); });
};
window.fontsOK = async () => { await document.fonts.load(`400 ${S}px BR`); await document.fonts.ready;
  return document.fonts.check(`400 ${S}px BR`) ? 'ok' : 'font missing'; };
</script></body></html>
