<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"PF";src:url("node_modules/@fontsource/playfair-display/files/playfair-display-latin-500-italic.woff2");font-weight:500;font-style:italic}
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
canvas{position:absolute;inset:0}
/* sombra GRANDE e densa: as letras flutuam sobre a imagem */
#wrap{position:absolute;inset:0;perspective:650px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.9)) drop-shadow(0 0 22px rgba(0,0,0,.75)) drop-shadow(0 10px 30px rgba(0,0,0,.55))}
#blk{position:absolute;font-family:"PF";font-style:italic;font-weight:500;line-height:1.12;transform-style:preserve-3d}
.ln{white-space:nowrap}
.w{display:inline-block;margin:0 .12em;padding:0 .05em;transform-origin:50% 60%;
   color:transparent;-webkit-background-clip:text;background-clip:text;
   background-image:linear-gradient(180deg,#FFFFFF 0%,#F6F0E6 45%,#CFC6B8 100%)}
.w.k{background-image:linear-gradient(180deg,var(--k1) 0%,var(--k2) 100%)}
</style></head><body><canvas id="under"></canvas><div id="wrap"><div id="blk"></div></div><canvas id="over"></canvas>
<script src="lado_data.js"></script>
<script>
// LADO = {size, kc, cuts:[t], burns:[t], blocks:[{start,end,x,y,align,maxw,lines:[[{w,s,k}]]}]}
// entrada "do nada": a palavra vem do fundo (longe, desfocada como fumaça) e chega nítida perto da câmera.
// saída: a frase se desfaz em fumaça — cada palavra sobe, abre e desfoca, em ordem aleatória.
const D = LADO, W = innerWidth, H = innerHeight, blk = document.getElementById('blk');
document.documentElement.style.setProperty('--k1', D.kc[0]); document.documentElement.style.setProperty('--k2', D.kc[1]);
blk.style.fontSize = D.size + 'px';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eOut = t => 1 - Math.pow(1 - t, 4), eIn = t => t * t;
const rnd = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
const IN = 0.75, OUT = 0.6;
let cur = null, spans = [], flat = [], order = [];
const ug = document.getElementById('under').getContext('2d'), og = document.getElementById('over').getContext('2d');
for (const c of ['under', 'over']) { const e = document.getElementById(c); e.width = W; e.height = H; }

// ---- efeitos Super 8 (determinísticos por quadro) ----
function film(t) {
  og.clearRect(0, 0, W, H); ug.clearRect(0, 0, W, H);
  const f = Math.floor(t * 30), r = rnd(f * 7919 + 3);
  // vazamento de luz laranja/vermelho que atravessa a tela depois de cada corte
  for (const c of D.cuts) {
    const k = (t - c) / 1.1; if (k < 0 || k > 1) continue;
    const rc = rnd(Math.floor(c * 100)), side = rc() < .5 ? -1 : 1, a = Math.sin(Math.PI * k) * (0.35 + rc() * 0.2);
    const cx = W * (0.5 + side * (0.75 - k * 0.6)), cy = H * (0.2 + rc() * 0.6);
    const gr = og.createRadialGradient(cx, cy, 0, cx, cy, W * 0.7);
    gr.addColorStop(0, `rgba(255,150,60,${a})`); gr.addColorStop(0.35, `rgba(230,60,30,${a * 0.6})`); gr.addColorStop(1, 'rgba(120,0,0,0)');
    og.globalCompositeOperation = 'screen'; og.fillStyle = gr; og.fillRect(0, 0, W, H); og.globalCompositeOperation = 'source-over';
  }
  // queimado de filme nas transições principais: mancha branca-laranja que estoura e some
  for (const b of D.burns) {
    const k = (t - b + 0.25) / 0.7; if (k < 0 || k > 1) continue;
    const rb = rnd(Math.floor(b * 77)), cx = W * (0.25 + rb() * 0.5), cy = H * (0.3 + rb() * 0.4), a = 0.8 * Math.sin(Math.PI * k);
    const gr = og.createRadialGradient(cx, cy, 0, cx, cy, W * (0.15 + 0.9 * eOut(k)));
    gr.addColorStop(0, `rgba(255,250,235,${a})`); gr.addColorStop(0.25, `rgba(255,190,90,${a * 0.9})`); gr.addColorStop(0.6, `rgba(200,60,10,${a * 0.6})`); gr.addColorStop(1, 'rgba(60,0,0,0)');
    og.globalCompositeOperation = 'screen'; og.fillStyle = gr; og.fillRect(0, 0, W, H); og.globalCompositeOperation = 'source-over';
  }
  // poeira, fios e riscos (mais fortes que no último vídeo)
  const n = Math.floor(r() * 6);
  for (let i = 0; i < n; i++) {
    const x = r() * W, y = r() * H, rad = 1 + r() * 3, light = r() < 0.45;
    og.fillStyle = light ? `rgba(255,245,225,${0.2 + r() * 0.3})` : `rgba(0,0,0,${0.3 + r() * 0.35})`;
    og.beginPath(); og.ellipse(x, y, rad, rad * (0.5 + r()), r() * 3, 0, 7); og.fill();
  }
  if (r() < 0.07) { const x = r() * W, y = r() * H; og.strokeStyle = 'rgba(0,0,0,.4)'; og.lineWidth = 1.4;
    og.beginPath(); og.moveTo(x, y); og.bezierCurveTo(x + 30 - r() * 60, y + 20, x - 20 + r() * 40, y + 40, x + 25 - r() * 50, y + 60); og.stroke(); }
  const blkN = Math.floor(t / 1.9), rb2 = rnd(blkN * 104729 + 9);
  if ((t % 1.9) < 0.6 && rb2() < 0.7) { const x = rb2() * W + Math.sin(t * 50) * 2; og.fillStyle = `rgba(255,248,230,${0.12 + rb2() * 0.15})`; og.fillRect(x, 0, 1.6, H); }
  if ((t % 1.9) < 0.6 && rb2() < 0.3) { const x = rb2() * W; og.fillStyle = 'rgba(0,0,0,.28)'; og.fillRect(x, 0, 1.2, H); }
  // janela de projetor Super 8: cantos arredondados e escuros, borda que respira
  const rr = 70 + 6 * Math.sin(t * 9), e = 10;
  og.fillStyle = 'rgba(0,0,0,1)'; og.beginPath(); og.rect(0, 0, W, H);
  og.roundRect(e, e, W - 2 * e, H - 2 * e, rr); og.fill('evenodd');
  const vg = og.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); og.fillStyle = vg; og.fillRect(0, 0, W, H);
}

window.render = t => {
  film(t);
  const B = D.blocks.find(b => t >= b.start && t < b.end) || null;
  if (B !== cur) {
    cur = B; blk.innerHTML = B ? B.lines.map(l => '<div class="ln">' + l.map(w => `<span class="w${w.k ? ' k' : ''}">${w.w}</span>`).join('') + '</div>').join('') : '';
    spans = [...blk.querySelectorAll('.w')]; flat = B ? B.lines.flat() : [];
    if (B) {
      blk.style.textAlign = B.align; blk.style.left = '0px'; blk.style.top = '0px';
      const bw = blk.offsetWidth, bh = blk.offsetHeight;
      blk.style.left = clamp(B.x * W - bw / 2, 34, W - bw - 34) + 'px';
      blk.style.top = clamp(B.y * H - bh / 2, 30, H - bh - 30) + 'px';
      const ro = rnd(Math.floor(B.start * 1000)); order = flat.map(() => ro());   // ordem da fumaça na saída
    }
  }
  if (!B) return;
  const n = flat.length, last = flat[n - 1].s, exit0 = Math.max(last + 0.4, B.end - OUT - 0.25);
  flat.forEach((w, i) => {
    const p = eOut(clamp((t - w.s) / IN));
    const o = eIn(clamp((t - exit0 - order[i] * 0.25) / OUT));
    const s = spans[i].style, a = t < w.s ? 0 : p * (1 - o);
    s.opacity = a.toFixed(3);
    const glow = w.k ? (0.5 + 1.1 * Math.sin(Math.PI * clamp((t - w.s) / 1.0))) * (1 - o) : 0;
    // brilho (lado.json "brilho": true): cada palavra acende com um clarão quente ao surgir e fica com um brilho leve
    const lw = D.brilho && t >= w.s ? (0.35 + 0.95 * Math.exp(-Math.pow((t - w.s - 0.25) / 0.35, 2))) * (1 - o) : 0;
    s.filter = `blur(${((1 - p) * 14 + o * 16).toFixed(2)}px)` + (lw > 0 ? ` drop-shadow(0 0 ${(6 + 18 * lw).toFixed(1)}px rgba(255,226,175,${(0.62 * lw).toFixed(3)}))` : '') + (glow > 0 ? ` drop-shadow(0 0 ${(8 + 14 * glow).toFixed(1)}px rgba(255,40,30,${(0.55 * glow).toFixed(3)}))` : '');
    s.transform = `translateZ(${(-(1 - p) * 420 + o * 120).toFixed(0)}px) translateY(${(-o * 26).toFixed(1)}px) rotateX(${((1 - p) * 10).toFixed(1)}deg) scale(${(1 + (1 - p) * 0.12 + o * 0.08).toFixed(3)})`;
  });
};
window.fontsOK = async () => { await document.fonts.load(`italic 500 ${D.size}px PF`); await document.fonts.ready;
  return document.fonts.check(`italic 500 ${D.size}px PF`) ? 'ok' : 'font missing'; };
</script></body></html>
